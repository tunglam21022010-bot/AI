<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Trước khi chia sẻ · AI - SHORT CHECK</title><link rel="stylesheet" href="style.css"><style>
.share-page{min-height:100vh;padding:75px 7vw;background:#f7f8fc}.share-head{text-align:center;max-width:800px;margin:auto}.share-head h1{font-size:clamp(40px,6vw,72px);line-height:1;margin:12px 0}.share-head p{color:#6a6e80}.check-box{max-width:850px;margin:45px auto;background:white;border:1px solid #dfe1e9;border-radius:28px;padding:30px;box-shadow:0 25px 70px #20243a0a}.check-item{display:flex;gap:18px;padding:21px 10px;border-bottom:1px solid #e8e9ef;cursor:pointer}.check-item:last-child{border-bottom:0}.check-item input{width:20px;height:20px;margin-top:3px}.check-item strong{display:block}.check-item span{display:block;font-size:12px;color:#777b8d;margin-top:3px}.check-actions{display:flex;justify-content:space-between;align-items:center;margin-top:25px;gap:15px}.meter{font-size:13px;font-weight:700}.result-box{margin-top:20px;padding:22px;border-radius:18px;display:none}.result-box.show{display:block}.good{background:#eafaf2;color:#236a4b}.care{background:#fff5dd;color:#765a12}.bad{background:#fff0f1;color:#8b3540}
</style></head><body><main class="share-page"><div class="share-head"><a class="home" href="index.html">← Về trang chủ</a><div class="eyebrow">THƯ VIỆN · 02</div><h1>Trước khi chia sẻ</h1><p>5 câu hỏi. Một lần dừng lại. Hãy kiểm tra trước khi bấm “Chia sẻ”.</p></div>
<div class="check-box"><label class="check-item"><input type="checkbox"><div><strong>Tôi biết nguồn ban đầu chưa?</strong><span>Biết nội dung đến từ đâu giúp bạn đánh giá độ tin cậy.</span></div></label>
<label class="check-item"><input type="checkbox"><div><strong>Tôi đã kiểm tra nội dung/bằng chứng chưa?</strong><span>Đừng chỉ dựa vào hình ảnh hoặc cảm giác “trông có vẻ thật”.</span></div></label>
<label class="check-item"><input type="checkbox"><div><strong>Tôi đã xem thông tin về cách tạo video chưa?</strong><span>Kiểm tra xem video có sử dụng AI hoặc có dấu hiệu chỉnh sửa hay không.</span></div></label>
<label class="check-item"><input type="checkbox"><div><strong>Tôi đã đối chiếu bằng nguồn phù hợp chưa?</strong><span>Đối chiếu với nguồn đáng tin cậy trước khi tin và chia sẻ.</span></div></label>
<label class="check-item"><input type="checkbox"><div><strong>Việc chia sẻ có ích và tôn trọng người liên quan không?</strong><span>Cân nhắc tác động của việc lan truyền nội dung.</span></div></label>
<div class="check-actions"><span class="meter" id="meter">0/5 đã kiểm tra</span><button class="btn primary" id="checkBtn">Đánh giá</button></div><div id="result" class="result-box"></div></div></main>
<script>
const boxes=[...document.querySelectorAll('.check-item input')],meter=document.getElementById('meter'),res=document.getElementById('result');
boxes.forEach(b=>b.onchange=()=>meter.textContent=boxes.filter(x=>x.checked).length+"/5 đã kiểm tra");
document.getElementById('checkBtn').onclick=()=>{let n=boxes.filter(x=>x.checked).length;res.className="result-box show "+(n===5?"good":n>=3?"care":"bad");res.innerHTML=n===5?"<b>Bạn đã hoàn thành 5/5.</b><br>Có thể cân nhắc chia sẻ sau khi vẫn giữ thói quen kiểm chứng.":n>=3?"<b>Bạn đã kiểm tra một phần.</b><br>Hãy hoàn thành 5 câu hỏi trước khi quyết định chia sẻ.":"<b>Khoan chia sẻ.</b><br>Hãy dừng lại và kiểm tra thêm nguồn, bằng chứng và tác động của việc chia sẻ."};
</script></body></html>
